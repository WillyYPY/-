<title>Teacher's Day Greeting</title>
<style>
/* ============================================================
   Teacher's Day Greeting - Auto-fit all screen sizes
   Tested on: 1280x720 / 1920x1080 / 2560x1440 / 3840x2160
   
   Design canvas: 1920 x 1080 (full HD baseline)
   JS will auto scale to fill actual screen, keeping aspect ratio.
   
   === HOW TO EDIT ===
   - Main title  -> search "main-title"     (in HTML)
   - Subtitle    -> search "subtitle"       (in HTML)
   - Blessing    -> search "blessing-text"  (in HTML)
   - Signature   -> search "signature"      (in HTML)
   - Colors/anim -> in <style> below
   ============================================================ */

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", sans-serif;
    cursor: none;
    background: #0f3460;
}

body {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
    position: relative;
}

/* ---- Background glow ---- */
.bg-glow {
    position: absolute; inset: 0;
    background:
        radial-gradient(circle at 20% 30%, rgba(255, 183, 77, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(255, 107, 107, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(120, 200, 255, 0.08) 0%, transparent 50%);
    z-index: 1;
}

#particles {
    position: absolute; inset: 0;
    z-index: 2;
    pointer-events: none;
}

/* ============================================================
   DESIGN CANVAS - fixed 1920x1080, JS scales this to fit screen
   ============================================================ */
.stage {
    position: absolute;
    top: 50%; left: 50%;
    width: 1920px;
    height: 1080px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(var(--stage-scale, 1));
    z-index: 10;
}

/* ---- Main content ---- */
.content {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px 80px;
}

/* ---- Main title ---- */
.main-title {
    font-size: 180px;
    font-weight: 900;
    letter-spacing: 28px;
    line-height: 1.15;
    margin-bottom: 16px;
    color: #fff;
    background: linear-gradient(135deg, #ffd700 0%, #ff6b6b 50%, #ff8e53 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 30px rgba(255, 200, 100, 0.5));
    opacity: 0;
    animation: fadeInDown 1.2s ease-out 0.3s forwards,
               titleGlow 3s ease-in-out 1.5s infinite alternate;
}

@keyframes titleGlow {
    from { filter: drop-shadow(0 0 20px rgba(255, 200, 100, 0.4)); }
    to   { filter: drop-shadow(0 0 45px rgba(255, 150, 100, 0.7)); }
}

/* ---- Subtitle ---- */
.subtitle {
    font-size: 42px;
    color: rgba(255, 255, 255, 0.85);
    letter-spacing: 16px;
    font-weight: 300;
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeIn 1.2s ease-out 0.8s forwards;
}

/* ---- Divider ---- */
.divider {
    width: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, #ffd700, transparent);
    margin-bottom: 48px;
    animation: expandLine 1.5s ease-out 1.2s forwards;
}

@keyframes expandLine {
    to { width: 60%; }
}

/* ---- Blessing text ---- */
.blessing-text {
    font-size: 36px;
    color: rgba(255, 255, 255, 0.9);
    line-height: 2.0;
    letter-spacing: 4px;
    font-weight: 300;
    opacity: 0;
    animation: fadeIn 1.5s ease-out 1.8s forwards;
}

.blessing-text p { margin-bottom: 4px; }

/* ---- Signature ---- */
.signature {
    margin-top: 60px;
    font-size: 28px;
    color: rgba(255, 215, 0, 0.8);
    letter-spacing: 10px;
    opacity: 0;
    animation: fadeIn 1.2s ease-out 2.5s forwards;
}

/* ---- Hint ---- */
.hint {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    color: rgba(255, 255, 255, 0.3);
    letter-spacing: 6px;
    opacity: 0;
    animation: fadeIn 1s ease-out 3s forwards;
}

/* ---- Animations ---- */
@keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-40px); }
    to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
}
@keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-18px) rotate(5deg); }
}

/* ---- Flower decorations (pixel positions on 1920x1080 canvas) ---- */
.flower {
    position: absolute;
    font-size: 56px;
    opacity: 0;
    z-index: 11;
    pointer-events: none;
    animation: fadeIn 1s ease-out forwards, float 4s ease-in-out infinite;
}
.flower.f1 { top: 120px;  left: 200px;  animation-delay: 1.0s, 1.0s; }
.flower.f2 { top: 190px;  right: 230px; animation-delay: 1.3s, 1.3s; }
.flower.f3 { bottom: 220px; left: 160px; animation-delay: 1.6s, 1.6s; }
.flower.f4 { bottom: 170px; right: 190px; animation-delay: 1.9s, 1.9s; }
.flower.f5 { top: 480px; left: 100px;  animation-delay: 2.1s, 2.1s; }
.flower.f6 { top: 530px; right: 110px; animation-delay: 2.4s, 2.4s; }
</style>

<script>
/* ============================================================
   Auto-fit stage to any screen size
   Design size: 1920 x 1080
   Scale = min( viewportWidth / 1920, viewportHeight / 1080 )
   ============================================================ */
(function() {
    const DESIGN_W = 1920;
    const DESIGN_H = 1080;
    const stage = document.getElementById('stage');

    function fit() {
        const sw = window.innerWidth / DESIGN_W;
        const sh = window.innerHeight / DESIGN_H;
        const scale = Math.min(sw, sh);
        stage.style.setProperty('--stage-scale', scale);
    }
    fit();
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', fit);
})();

/* ============================================================
   Particle canvas
   ============================================================ */
(function() {
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const colors = ['#ffd700', '#ff6b6b', '#ff8e53', '#ffb74d', '#fff176', '#ff8a80'];

    class Particle {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * -canvas.height;
            this.size = Math.random() * 6 + 2;
            this.speedY = Math.random() * 1.5 + 0.5;
            this.speedX = (Math.random() - 0.5) * 1;
            this.color = colors[Math.floor(Math.random() * colors.length)];
            this.opacity = Math.random() * 0.6 + 0.3;
            this.angle = Math.random() * Math.PI * 2;
            this.spin = (Math.random() - 0.5) * 0.05;
        }
        update() {
            this.y += this.speedY;
            this.x += this.speedX + Math.sin(this.angle) * 0.5;
            this.angle += this.spin;
            if (this.y > canvas.height + 20) this.reset();
        }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            ctx.globalAlpha = this.opacity;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.ellipse(0, 0, this.size, this.size * 1.8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    const particleCount = Math.min(150, Math.floor((canvas.width * canvas.height) / 50000));
    for (let i = 0; i < particleCount; i++) {
        const p = new Particle();
        p.y = Math.random() * canvas.height;
        particles.push(p);
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animate);
    }
    animate();
})();
</script>
